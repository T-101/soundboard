<!DOCTYPE html>{% load static plausible %}
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    {% block title %}
        <title>Soundboard</title>
        <meta property="og:title" content="Soundboard"/>
    {% endblock %}
    <meta property="og:description" content="Yet Another Soundboard"/>
    <meta property="og:url" content="https://soundboard.didnot.win"/>
    <meta property="og:image" content="https://soundboard.didnot.win/static/soundboard/soundboard_icon_v2_192.webp"/>
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'soundboard/soundboard_icon_v2_180.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'soundboard/soundboard_icon_v2_32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'soundboard/soundboard_icon_v2_16.png' %}">
    <link rel="manifest" href="{% static 'soundboard/site.webmanifest' %}">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script src="{% static 'soundboard/bs-color-mode-toggler.js' %}"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/css/bootstrap.min.css"
          integrity="sha512-2bBQCjcnw658Lho4nlXJcc6WkV/UxpE/sAokbXPxQNGqmNdQrWqtw26Ns9kFF/yG792pKR1Sx8/Y1Lf1XN4GKA=="
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
          integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <link rel="stylesheet" href="{% static 'soundboard/styles.css' %}"/>
    {% block extrahead %}
    {% endblock %}
</head>
<body>

<nav class="navbar navbar-expand-sm navbar-dark bg-primary mb-4">
    <div class="container-fluid">
        <a class="text-decoration-none" href="{% url 'soundboard:list' %}">
            <span class="navbar-brand mb-0">
                <img src="{% static 'soundboard/soundboard_icon_v2_192.webp' %}"
                     alt="Speaker icon" style="height: 2rem" class="me-2"/>
                Soundboard Did Not Win</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarSupportedContent">
            <ul class="navbar-nav mx-2">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown" href="#" role="button"
                       aria-haspopup="true" aria-expanded="false"><i class="fa-solid fa-sun"></i></a>
                    <div class="dropdown-menu dropdown-menu-end">
                        <button class="dropdown-item" data-bs-theme-value="light">
                            <i class="fa-solid fa-sun me-2"></i>Light Mode
                        </button>
                        <button class="dropdown-item" data-bs-theme-value="dark">
                            <i class="fa-solid fa-moon me-2"></i>Dark Mode
                        </button>
                        <button class="dropdown-item" data-bs-theme-value="auto">
                            <i class="fa-solid fa-wand-magic-sparkles me-2"></i>Automatic
                        </button>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</nav>

{% block content %}
{% endblock %}

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.bundle.min.js"
        integrity="sha512-HvOjJrdwNpDbkGJIG2ZNqDlVqMo77qbs4Me4cah0HoDrfhrbA+8SBlZn1KrvAQw7cILLPFJvdwIgphzQmMm+Pw=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
{% if request.resolver_match.namespace == "normal" %}
    {% plausible %}
{% endif %}

</body>
</html>
